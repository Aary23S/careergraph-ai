services:
  postgres:
    image: postgres:16-alpine
    container_name: careergraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careergraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REMOVED_SECRET_POSTGRES
    ports:
      - "5432:5432"
    volumes:
      - careergraph_postgres_data:/var/lib/postgresql/data
      # Phase 4F: creates a separate `mlflow` database on first init, kept
      # logically isolated from CareerGraph's application tables. Only runs
      # against a brand-new (empty) data volume -- see docs/mlflow-setup.md
      # for the one-time manual fallback if your volume predates this file.
      - ./db/init-mlflow-db.sql:/docker-entrypoint-initdb.d/init-mlflow-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careergraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    container_name: careergraph-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:REMOVED_SECRET_POSTGRES@postgres:5432/careergraph
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: REMOVED_SECRET_JWT_ACCESS
      JWT_REFRESH_SECRET: REMOVED_SECRET_JWT_REFRESH=
      # Phase 4D: Python AI/ML service (embeddings/reranking) -- off by
      # default. Reached over the internal compose network, never the
      # host-bound port below.
      ML_SERVICE_ENABLED: "false"
      ML_SERVICE_URL: http://ai-service:8000
      # Phase 4F: MLflow experiment tracking -- off by default. Node never
      # calls MLflow directly (see docs/experiment-tracking.md); this flag
      # only controls whether ai-evaluate.js attempts to ask ai-service to
      # log a run.
      MLFLOW_ENABLED: "false"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    container_name: careergraph-ai-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      # Phase 4F: same flag family as above, consumed here by
      # app/tracking/mlflow_client.py. Reached over the internal compose
      # network at the `mlflow` service name, never the host-bound port.
      MLFLOW_ENABLED: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5001
      MLFLOW_EXPERIMENT_PREFIX: careergraph
    ports:
      # Host-side bound to localhost only -- this service must never be
      # reachable from outside the machine (see ai-service/README.md).
      - "127.0.0.1:8000:8000"

  mlflow:
    build:
      # Reuses the ai-service image (already installs `mlflow` +
      # `psycopg2-binary` via requirements.txt) rather than maintaining a
      # second Dockerfile just to run `mlflow server`.
      context: ./ai-service
    container_name: careergraph-mlflow
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql://postgres:REMOVED_SECRET_POSTGRES@postgres:5432/mlflow
      - --default-artifact-root
      - /mlartifacts
      - --host
      - 0.0.0.0
      - --port
      - "5001"
    volumes:
      - careergraph_mlflow_artifacts:/mlartifacts
    ports:
      # Host-side bound to localhost only, same posture as ai-service --
      # this is a local dev tool, not meant to be reachable externally.
      - "127.0.0.1:5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./client
    container_name: careergraph-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  careergraph_postgres_data:
  careergraph_mlflow_artifacts:

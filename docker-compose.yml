services:
  postgres:
    image: postgres:16-alpine
    container_name: careergraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careergraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: [PASSWORD]
    ports:
      - "5432:5432"
    volumes:
      - careergraph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careergraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    container_name: careergraph-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:aary234786@postgres:5432/careergraph
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: nY0bl6sD0/z1gqvjRHFStGRZZpjuYXoSgwWA9YydmEs=
      JWT_REFRESH_SECRET: c53ujCyEWNbk3wW4+Zf80TVJUkyzYtTEnS9i+szmH5Y=
      # Phase 4D: Python AI/ML service (embeddings/reranking) -- off by
      # default. Reached over the internal compose network, never the
      # host-bound port below.
      ML_SERVICE_ENABLED: "false"
      ML_SERVICE_URL: http://ai-service:8000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    container_name: careergraph-ai-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      # Host-side bound to localhost only -- this service must never be
      # reachable from outside the machine (see ai-service/README.md).
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./client
    container_name: careergraph-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  careergraph_postgres_data:
